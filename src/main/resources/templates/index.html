<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Home')">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center">Kenyan ID Verification System</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <p>Welcome to the Kenyan ID Verification System. This system allows you to verify your identity by capturing your National ID and performing a liveness check.</p>
                        </div>
                        <div class="d-grid gap-2">
                            <a th:href="@{/verification/start}" class="btn btn-primary btn-lg">Start Verification</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/header :: scripts"></div>
</body>
</html>
