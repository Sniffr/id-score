<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Liveness Check')">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center">Liveness Check</h3>
                    </div>
                    <div class="card-body">
                        <div class="step-indicator">
                            <div class="step completed">
                                <div class="step-circle">1</div>
                                <div class="step-line"></div>
                                <div class="step-title">Start</div>
                            </div>
                            <div class="step completed">
                                <div class="step-circle">2</div>
                                <div class="step-line"></div>
                                <div class="step-title">ID Front</div>
                            </div>
                            <div class="step completed">
                                <div class="step-circle">3</div>
                                <div class="step-line"></div>
                                <div class="step-title">ID Back</div>
                            </div>
                            <div class="step active">
                                <div class="step-circle">4</div>
                                <div class="step-line"></div>
                                <div class="step-title">Liveness</div>
                            </div>
                            <div class="step">
                                <div class="step-circle">5</div>
                                <div class="step-title">Complete</div>
                            </div>
                        </div>
                        
                        <div class="liveness-instructions mb-4">
                            <h5>Liveness Check Instructions:</h5>
                            <p>Please follow the instructions below to complete the liveness check:</p>
                            <div class="alert alert-primary">
                                <strong id="instruction-text">Look straight at the camera</strong>
                            </div>
                            
                            <!-- Progress bar -->
                            <div class="progress mb-3">
                                <div class="progress-bar liveness-progress-bar" role="progressbar" style="width: 0%;" 
                                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            
                            <!-- Instruction status indicators -->
                            <div class="instruction-status-container d-flex justify-content-between mb-3">
                                <span class="instruction-status-0"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-1"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-2"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-3"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-4"><i class="bi bi-circle"></i></span>
                            </div>
                            
                            <button type="button" id="next-instruction-btn" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-arrow-right-circle"></i> Next Instruction
                            </button>
                        </div>
                        
                        <div id="liveness-app">
                            <form th:action="@{/verification/complete}" method="post" id="livenessForm">
                                <input type="hidden" name="idNumber" th:value="${idNumber}">
                                <input type="hidden" name="fullName" th:value="${fullName}">
                                <input type="hidden" name="frontImageData" th:value="${frontImageData}">
                                <input type="hidden" name="backImageData" th:value="${backImageData}">
                                <input type="hidden" id="livenessImageData" name="livenessImageData" v-model="formImageData">
                                
                                <div v-if="!capturedImage" class="mb-4">
                                    <div class="camera-container position-relative mb-3">
                                        <video ref="video" :class="{ 'camera-active': isCameraActive }" autoplay playsinline></video>
                                        <canvas ref="canvas" style="display: none;"></canvas>
                                        
                                        <div class="face-guide" :class="{ 'valid-position': isValidPosition }">
                                            <div class="guide-message">{{ positionMessage }}</div>
                                        </div>
                                        
                                        <div v-if="currentInstruction" class="instruction-overlay">
                                            <div class="instruction-text">{{ currentInstruction }}</div>
                                            <div class="instruction-progress">
                                                <div class="progress">
                                                    <div class="progress-bar" :style="{ width: progressPercentage + '%' }"></div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <button 
                                            @click="switchCamera" 
                                            class="switch-camera-btn btn btn-sm btn-light">
                                            <i class="bi bi-arrow-repeat"></i> Switch Camera
                                        </button>
                                    </div>
                                    
                                    <div class="d-grid">
                                        <button 
                                            @click="captureImage" 
                                            :disabled="!allInstructionsCompleted" 
                                            class="btn btn-primary btn-lg capture-btn">
                                            <i class="bi bi-camera"></i> {{ captureButtonText }}
                                        </button>
                                    </div>
                                </div>
                                
                                <div v-else class="mb-4">
                                    <h5 class="mb-3">Preview:</h5>
                                    <div class="preview-container mb-3">
                                        <img :src="capturedImage" class="preview-image img-fluid" alt="Liveness Preview">
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <button type="button" @click="retakeImage" class="btn btn-secondary">
                                            <i class="bi bi-arrow-counterclockwise"></i> Retake Photo
                                        </button>
                                        <button type="submit" class="btn btn-success">
                                            <i class="bi bi-check-lg"></i> Confirm & Complete Verification
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        new Vue({
            el: '#liveness-app',
            data: {
                isCameraActive: false,
                isValidPosition: false,
                positionMessage: 'Position your face within the guide',
                captureButtonText: 'Capture Verification Image',
                capturedImage: null,
                formImageData: '',
                stream: null,
                currentFacingMode: 'user', // Start with front camera
                validationTimer: null,
                processingFrame: false,
                currentInstruction: 'Look straight at the camera',
                instructionIndex: 0,
                instructions: [
                    'Look straight at the camera',
                    'Blink your eyes slowly',
                    'Turn your head slightly to the right',
                    'Turn your head slightly to the left',
                    'Smile naturally'
                ],
                instructionProgress: [0, 0, 0, 0, 0],
                progressPercentage: 0,
                allInstructionsCompleted: false
            },
            mounted() {
                this.initOpenCV();
            },
            methods: {
                async initOpenCV() {
                    // Initialize OpenCV.js
                    await IDDocumentDetection.initialize();
                    this.initCamera();
                },
                
                initCamera() {
                    const constraints = {
                        video: {
                            facingMode: this.currentFacingMode,
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };
                    
                    // First check if we have permission
                    if (navigator.permissions && navigator.permissions.query) {
                        navigator.permissions.query({ name: 'camera' })
                            .then(permissionStatus => {
                                this.handleCameraPermission(permissionStatus, constraints);
                                
                                // Listen for permission changes
                                permissionStatus.onchange = () => {
                                    this.handleCameraPermission(permissionStatus, constraints);
                                };
                            })
                            .catch(err => {
                                // Fallback to direct getUserMedia if permissions API not supported
                                this.requestCameraAccess(constraints);
                            });
                    } else {
                        // Fallback for browsers that don't support permissions API
                        this.requestCameraAccess(constraints);
                    }
                },
                
                handleCameraPermission(permissionStatus, constraints) {
                    if (permissionStatus.state === 'granted') {
                        this.requestCameraAccess(constraints);
                    } else if (permissionStatus.state === 'prompt') {
                        // Show permission guidance UI before requesting
                        this.showPermissionGuidance();
                        this.requestCameraAccess(constraints);
                    } else if (permissionStatus.state === 'denied') {
                        this.showPermissionDeniedMessage();
                    }
                },
                
                showPermissionGuidance() {
                    // Add guidance message to the camera container
                    const cameraContainer = document.querySelector('.camera-container');
                    if (cameraContainer) {
                        const guidanceElement = document.createElement('div');
                        guidanceElement.className = 'permission-guidance';
                        guidanceElement.innerHTML = `
                            <div class="permission-message">
                                <i class="bi bi-camera-video"></i>
                                <h5>Camera Permission Required</h5>
                                <p>This app needs camera access to verify your identity. Please allow when prompted.</p>
                            </div>
                        `;
                        cameraContainer.appendChild(guidanceElement);
                    }
                },
                
                showPermissionDeniedMessage() {
                    const cameraContainer = document.querySelector('.camera-container');
                    if (cameraContainer) {
                        // Clear container
                        while (cameraContainer.firstChild) {
                            cameraContainer.removeChild(cameraContainer.firstChild);
                        }
                        
                        // Add denied message
                        const deniedElement = document.createElement('div');
                        deniedElement.className = 'permission-denied';
                        deniedElement.innerHTML = `
                            <div class="permission-message">
                                <i class="bi bi-camera-video-off"></i>
                                <h5>Camera Access Denied</h5>
                                <p>Camera access is required to continue. Please enable camera access in your browser settings and refresh this page.</p>
                                <button class="btn btn-primary mt-3" onclick="location.reload()">Refresh Page</button>
                            </div>
                        `;
                        cameraContainer.appendChild(deniedElement);
                    }
                    
                    this.isCameraActive = false;
                    
                    // For demo purposes, simulate progress
                    this.simulateProgress();
                },
                
                requestCameraAccess(constraints) {
                    navigator.mediaDevices.getUserMedia(constraints)
                        .then(stream => {
                            this.stream = stream;
                            this.$refs.video.srcObject = stream;
                            this.isCameraActive = true;
                            this.startFaceDetection();
                            
                            // Remove any permission guidance if present
                            const guidanceElement = document.querySelector('.permission-guidance');
                            if (guidanceElement && guidanceElement.parentNode) {
                                guidanceElement.parentNode.removeChild(guidanceElement);
                            }
                        })
                        .catch(err => {
                            console.error('Camera error:', err);
                            if (err.name === 'NotAllowedError') {
                                this.showPermissionDeniedMessage();
                            } else {
                                alert('Error accessing camera: ' + err.message);
                                // For demo purposes, simulate progress
                                this.simulateProgress();
                            }
                        });
                },
                
                startFaceDetection() {
                    this.validationTimer = setInterval(() => {
                        if (this.processingFrame) return;
                        this.processingFrame = true;
                        
                        const video = this.$refs.video;
                        const canvas = this.$refs.canvas;
                        
                        if (video.readyState === 4) {
                            // Draw current frame to canvas
                            const context = canvas.getContext('2d');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            context.drawImage(video, 0, 0, canvas.width, canvas.height);
                            
                            // Process current instruction
                            this.processCurrentInstruction(canvas);
                            
                            this.processingFrame = false;
                        } else {
                            this.processingFrame = false;
                        }
                    }, 100);
                },
                
                processCurrentInstruction(canvas) {
                    // For demo purposes, simulate instruction progress
                    // In a real implementation, this would use face-api.js or OpenCV.js
                    // to detect specific facial movements
                    
                    if (this.instructionIndex < this.instructions.length) {
                        // Increment progress for current instruction
                        if (this.instructionProgress[this.instructionIndex] < 100) {
                            this.instructionProgress[this.instructionIndex] += 2;
                            
                            // Update overall progress
                            this.updateOverallProgress();
                            
                            // If current instruction is complete, move to next
                            if (this.instructionProgress[this.instructionIndex] >= 100) {
                                if (this.instructionIndex < this.instructions.length - 1) {
                                    this.instructionIndex++;
                                    this.currentInstruction = this.instructions[this.instructionIndex];
                                } else {
                                    // All instructions completed
                                    this.allInstructionsCompleted = true;
                                    this.currentInstruction = 'All checks completed! You can now capture your verification image.';
                                    this.captureButtonText = 'Capture Final Verification Image';
                                }
                            }
                        }
                    }
                },
                
                updateOverallProgress() {
                    // Calculate overall progress
                    const totalProgress = this.instructionProgress.reduce((sum, progress) => sum + progress, 0);
                    this.progressPercentage = totalProgress / this.instructions.length;
                },
                
                simulateProgress() {
                    // For demo purposes only
                    const simulateInterval = setInterval(() => {
                        if (this.instructionIndex < this.instructions.length) {
                            // Increment progress for current instruction
                            if (this.instructionProgress[this.instructionIndex] < 100) {
                                this.instructionProgress[this.instructionIndex] += 5;
                                
                                // Update overall progress
                                this.updateOverallProgress();
                                
                                // If current instruction is complete, move to next
                                if (this.instructionProgress[this.instructionIndex] >= 100) {
                                    if (this.instructionIndex < this.instructions.length - 1) {
                                        this.instructionIndex++;
                                        this.currentInstruction = this.instructions[this.instructionIndex];
                                    } else {
                                        // All instructions completed
                                        this.allInstructionsCompleted = true;
                                        this.currentInstruction = 'All checks completed! You can now capture your verification image.';
                                        this.captureButtonText = 'Capture Final Verification Image';
                                        clearInterval(simulateInterval);
                                    }
                                }
                            }
                        } else {
                            clearInterval(simulateInterval);
                        }
                    }, 200);
                },
                
                captureImage() {
                    const canvas = this.$refs.canvas;
                    const video = this.$refs.video;
                    const context = canvas.getContext('2d');
                    
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    if (video.videoWidth) {
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    } else {
                        // Create a placeholder image for testing
                        context.fillStyle = '#f0f0f0';
                        context.fillRect(0, 0, canvas.width, canvas.height);
                        context.fillStyle = '#333';
                        context.font = '20px Arial';
                        context.textAlign = 'center';
                        context.fillText('Liveness Verification Successful', canvas.width/2, canvas.height/2);
                    }
                    
                    this.capturedImage = canvas.toDataURL('image/jpeg');
                    this.formImageData = this.capturedImage;
                    document.getElementById('livenessImageData').value = this.capturedImage;
                    
                    if (this.validationTimer) {
                        clearInterval(this.validationTimer);
                    }
                    
                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                    }
                },
                
                retakeImage() {
                    this.capturedImage = null;
                    this.formImageData = '';
                    this.initCamera();
                },
                
                switchCamera() {
                    if (this.stream) {
                        this.stream.getTracks().forEach(track => track.stop());
                    }
                    
                    // Toggle facing mode
                    this.currentFacingMode = this.currentFacingMode === 'environment' ? 'user' : 'environment';
                    
                    // Reinitialize camera with new facing mode
                    this.initCamera();
                }
            },
            beforeDestroy() {
                if (this.validationTimer) {
                    clearInterval(this.validationTimer);
                }
                
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                }
            }
        });
    </script>

    <div th:replace="fragments/header :: scripts"></div>
</body>
</html>
