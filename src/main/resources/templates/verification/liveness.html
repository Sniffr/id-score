<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Liveness Check')">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center">Liveness Check</h3>
                    </div>
                    <div class="card-body">
                        <div class="step-indicator">
                            <div class="step completed">
                                <div class="step-circle">1</div>
                                <div class="step-line"></div>
                                <div class="step-title">Start</div>
                            </div>
                            <div class="step completed">
                                <div class="step-circle">2</div>
                                <div class="step-line"></div>
                                <div class="step-title">ID Front</div>
                            </div>
                            <div class="step completed">
                                <div class="step-circle">3</div>
                                <div class="step-line"></div>
                                <div class="step-title">ID Back</div>
                            </div>
                            <div class="step active">
                                <div class="step-circle">4</div>
                                <div class="step-line"></div>
                                <div class="step-title">Liveness</div>
                            </div>
                            <div class="step">
                                <div class="step-circle">5</div>
                                <div class="step-title">Complete</div>
                            </div>
                        </div>
                        
                        <div class="liveness-instructions mb-4">
                            <h5>Liveness Check Instructions:</h5>
                            <p>Please follow the instructions below to complete the liveness check:</p>
                            <div class="alert alert-primary">
                                <strong id="instruction-text">Look straight at the camera</strong>
                            </div>
                            
                            <!-- Progress bar -->
                            <div class="progress mb-3">
                                <div class="progress-bar liveness-progress-bar" role="progressbar" style="width: 0%;" 
                                     aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            
                            <!-- Instruction status indicators -->
                            <div class="instruction-status-container d-flex justify-content-between mb-3">
                                <span class="instruction-status-0"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-1"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-2"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-3"><i class="bi bi-circle"></i></span>
                                <span class="instruction-status-4"><i class="bi bi-circle"></i></span>
                            </div>
                            
                            <button type="button" id="next-instruction-btn" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-arrow-right-circle"></i> Next Instruction
                            </button>
                        </div>
                        
                        <form th:action="@{/verification/complete}" method="post" id="livenessForm">
                            <input type="hidden" name="idNumber" th:value="${idNumber}">
                            <input type="hidden" name="fullName" th:value="${fullName}">
                            <input type="hidden" name="frontImageData" th:value="${frontImageData}">
                            <input type="hidden" name="backImageData" th:value="${backImageData}">
                            <input type="hidden" id="livenessImageData" name="livenessImageData">
                            
                            <div id="liveness-capture-container" class="mb-4">
                                <div class="camera-container mb-3">
                                    <video id="liveness-video" autoplay playsinline></video>
                                    <canvas id="liveness-canvas" style="display: none;"></canvas>
                                </div>
                                <div class="d-grid">
                                    <button type="button" id="liveness-capture-btn" class="btn btn-primary btn-lg">
                                        <i class="bi bi-camera"></i> Capture Liveness Image
                                    </button>
                                </div>
                            </div>
                            
                            <div id="liveness-preview-container" class="d-none mb-4">
                                <h5 class="mb-3">Preview:</h5>
                                <div class="preview-container mb-3">
                                    <img id="liveness-preview-image" class="preview-image" src="" alt="Liveness Preview">
                                </div>
                                <div class="d-flex justify-content-between">
                                    <button type="button" id="liveness-retake-btn" class="btn btn-secondary">
                                        <i class="bi bi-arrow-counterclockwise"></i> Retake Photo
                                    </button>
                                    <button type="submit" id="liveness-confirm-btn" class="btn btn-success">
                                        <i class="bi bi-check-lg"></i> Confirm & Complete Verification
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/header :: scripts"></div>
</body>
</html>
